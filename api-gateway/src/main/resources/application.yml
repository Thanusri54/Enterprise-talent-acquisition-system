server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: candidate-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/candidates/**

        - id: job-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/jobs/**

        - id: application-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/applications/**

        - id: pipeline-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/pipeline/**

        - id: interview-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/interviews/**

        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false

jwt:
  secret: enterpriseTalentAcquisitionSuperSecretKey2026With256BitsMinimumBitLengthRequiredForHS256Algorithm!
